name: Host Ship Auto Renew

on:
  schedule:
    # 每周四 UTC 22:00（北京时间次日 06:00）运行，可根据你的 30 天周期调整
    - cron: '0 22 * * 4'
  workflow_dispatch:  # 允许手动触发

jobs:
  Renew-HostShip:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: ⚙ 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: 🛠️ 安装系统依赖和 Python 依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk
        pip install seleniumbase requests
        seleniumbase install chromedriver

    - name: ⚙ 设置代理 (sing-box，可选)
      continue-on-error: true
      env:
        NODE_LINK: ${{ secrets.NODE_LINK }}
      run: |
        bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

    - name: 🚀 运行续期脚本
      env:
        HOSTSHIP_EMAIL: ${{ secrets.HOSTSHIP_EMAIL }}
        HOSTSHIP_PASSWORD: ${{ secrets.HOSTSHIP_PASSWORD }}
        HOSTSHIP_SERVER_ID: ${{ secrets.HOSTSHIP_SERVER_ID }}
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        IS_PROXY: ${{ secrets.IS_PROXY || 'false' }}
        PROXY_SERVER: ${{ secrets.PROXY_SERVER || 'http://127.0.0.1:1081' }}
      run: |
        xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
          python3 app.py

    - name: 🧹 清理旧的工作流运行记录
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
        count=0
        for run_id in $runs; do
          count=$((count + 1))
          if [ $count -gt 1 ]; then
            echo "删除运行记录: $run_id"
            gh run delete $run_id || true
          fi
        done
