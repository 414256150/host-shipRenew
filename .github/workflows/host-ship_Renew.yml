name: Host-Ship 续期

on:
  schedule:
    - cron: '0 22 * * 4'    # 每周四 22:00 (UTC时间) 触发一次，北京时间6:00，即每 7 天运行一次
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  renew-run:
    name: 自动化续期节点
    runs-on: ubuntu-latest

    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装系统底层依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb curl
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i /tmp/chrome.deb || sudo apt-get install -f -y

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install DrissionPage xvfbwrapper requests

      - name: 启用 WARP 网络 (防止面板阻断 GitHub IP)
        uses: fscarmen/warp-on-actions@v1.3
        with:
          stack: dual
          mode: client

      - name: 执行 Host-Ship 自动续签
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PANEL_USER: ${{ secrets.PANEL_USER }}
          PANEL_PASS: ${{ secrets.PANEL_PASS }}
        run: python -u main.py

      - name: 归档运行截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hostship-screenshots-${{ github.run_number }}
          path: output/screenshots/*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: 自动清理历史工作流记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 2
